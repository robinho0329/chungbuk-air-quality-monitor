name: 🌬️ 충북 대기질 자동 수집

# 컴퓨터 꺼져있어도 GitHub 서버에서 매시 자동 실행.
# 결과 SQLite DB는 레포에 자동 커밋되어 영속 저장.

on:
  # [Primary] 외부 스케줄러(cron-job.org → workflow_dispatch) 매시 호출 + UI 수동 실행.
  workflow_dispatch:

  # [Safety net] 6시간마다 예비 실행.
  #
  # 내장 schedule은 2026-06-19(7926cd3)에 제거했었다. 이유는 ① best-effort라 드롭이
  # 잦고 ② 정시 외부 cron과 동시 push 충돌로 실패 알림 메일을 양산해서다.
  # 그 판단 자체는 맞았지만, 외부 cron이 **유일한** 트리거가 되면서 단일 장애점이 됐다.
  # 실제로 2026-08-26 외부 cron 호출이 끊긴 뒤 16일간 수집이 0건이었고,
  # self-heal 윈도(72h)를 한참 넘겨 그 구간은 자동 복구도 불가능해졌다.
  #
  # 그래서 '매시 수집'이 아니라 **72h 윈도를 지키는 최소 안전망**으로만 되돌린다.
  #   - 6시간 간격 → 외부 cron이 죽어도 갭이 72h 를 넘지 않아 self-heal 이 메운다
  #   - 분을 :45 로 둠 → 외부 cron(:05/:15/:35/:55)과 시각이 겹치지 않아 push 충돌 회피
  #   - concurrency 그룹이 중복 실행을 막고, 커밋 단계에 충돌 재시도가 이미 있다
  # 외부 cron 이 정상이면 이 트리거가 실제로 새로 가져올 데이터는 거의 없다.
  schedule:
    - cron: "45 */6 * * *"  # 00:45 / 06:45 / 12:45 / 18:45 UTC

permissions:
  contents: write  # 결과 DB 커밋 & push 권한

# 동시 실행 방지: 이전 run이 끝나기 전에 새 cron이 떠도 큐에 안 쌓이게.
concurrency:
  group: airkorea-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 레포 체크아웃
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 🚀 uv 설치
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: 🐍 Python 3.14 설치 (uv)
        run: uv python install 3.14

      - name: 📦 의존성 설치
        run: uv sync --frozen

      - name: 🌬️ 에어코리아 1회 수집 실행
        env:
          AIRKOREA_API_KEY: ${{ secrets.AIRKOREA_API_KEY }}
          AIRKOREA_API_KEY_ENCODED: ${{ secrets.AIRKOREA_API_KEY }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        # 종료 코드 75 = 상류(apis.data.go.kr) 미응답으로 이번 슬롯만 건너뜀.
        # self-heal 72h 윈도가 다음 성공 실행에서 메우므로 데이터는 잃지 않는다.
        # 이걸 실패로 두면 최근 10회 중 5회가 빨개져 진짜 고장을 구별할 수 없다.
        # 감추지는 않는다 — warning 주석과 요약에 남겨 건너뛴 사실이 보이게 한다.
        run: |
          set +e
          uv run python scripts/collect_once.py
          code=$?
          set -e
          if [ "$code" -eq 75 ]; then
            echo "::warning::상류 API 미응답 — 이번 슬롯 건너뜀 (self-heal 이 다음 성공 실행에서 복구)"
            echo "- ⏭️ 상류 API 미응답으로 이번 슬롯 건너뜀" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit $code

      - name: 🌦️ 기상청 ASOS 수집 (WEATHER_API_KEY 있을 때만)
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: uv run python scripts/collect_weather.py
        # 키 없으면 스크립트가 스킵 후 exit 0 → 기존 수집에 영향 없음

      - name: 📊 누적 카운트 출력
        run: |
          uv run python -c "
          from collections import Counter
          from src.storage.database import query_all
          rows = query_all()
          print(f'총 {len(rows)}건 누적')
          for k, v in Counter(r.station_name for r in rows).items():
              print(f'  {k}: {v}건')
          " || true

      - name: 📤 DB 변경 시 커밋 & 푸시 (충돌 시 멱등 재수집 재시도)
        env:
          AIRKOREA_API_KEY: ${{ secrets.AIRKOREA_API_KEY }}
          AIRKOREA_API_KEY_ENCODED: ${{ secrets.AIRKOREA_API_KEY }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          git config user.email "airkorea-bot@github-actions"
          git config user.name "Airkorea Collect Bot"

          # 바이너리 data.db는 rebase 자동 병합이 불가능하다. 동시 push로 거부되면
          # 원격 최신으로 리셋 후 collect_once를 재실행(INSERT OR IGNORE = 멱등)해
          # 이번 시각 데이터를 최신 DB에 다시 삽입하고 재커밋·재푸시한다.
          for attempt in 1 2 3 4 5; do
            git add src/storage/data.db
            if git diff --staged --quiet; then
              echo "DB 변경 없음 — 커밋 스킵 (이미 반영됨/중복 INSERT OR IGNORE)"
              exit 0
            fi
            TS=$(date -u +'%Y-%m-%dT%H:%MZ')
            COUNT=$(uv run python -c "from src.storage.database import query_all; print(len(query_all()))" 2>/dev/null || echo "?")
            git commit -m "auto(collect): airkorea snapshot ${TS} (누적 ${COUNT}건)"
            if git push origin main; then
              echo "✅ push 성공 (시도 ${attempt}/5)"
              exit 0
            fi
            echo "⚠️ push 거부(non-fast-forward) — 원격 반영 후 멱등 재수집 (${attempt}/5)"
            git fetch origin main
            git reset --hard origin/main          # 내 커밋·로컬 DB 폐기, 원격 최신 채택
            uv run python scripts/collect_once.py || true   # 최신 DB에 이번 시각 재삽입
            sleep $(( (RANDOM % 6) + 2 ))
          done
          echo "❌ 5회 재시도 후에도 push 실패"
          exit 1

      - name: 🔔 SPC 이상 탐지 알림 (Cpk 미달 / WE Rules 위반)
        if: ${{ env.DISCORD_WEBHOOK_URL != '' }}
        env:
          AIRKOREA_API_KEY: ${{ secrets.AIRKOREA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: uv run python flows/alert_flow.py || true
        # || true: 알림 실패해도 수집 워크플로우 전체는 성공으로 처리
